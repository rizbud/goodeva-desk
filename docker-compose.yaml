name: goodeva-desk

services:
  postgres:
    image: postgres:16-alpine
    container_name: goodeva-desk_postgres
    environment:
      POSTGRES_USER: goodeva
      POSTGRES_PASSWORD: goodeva
      POSTGRES_DB: goodeva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - goodeva-desk_network

  redis:
    image: redis:7-alpine
    container_name: goodeva-desk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - goodeva-desk_network

volumes:
  postgres-data:
  redis-data:

networks:
  goodeva-desk_network:
    name: goodeva-desk_network
    driver: bridge
